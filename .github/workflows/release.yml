name: Release

# A release tag (v1.2.3), pushed by deploy-release.ps1, built and published
# here instead of from a home connection, as wslc-ai-agent's: the two APKs,
# KeyPlus-Popup.apk and Berpiztu-AI-Keyboard.apk, each built by a job of its
# own, side by side, and Berpiztu AI Keyboard's
# Windows installer, Berpiztu-AI-Keyboard-Windows.msi, by a third, all at
# exactly the version the tag's commit carries; then one job publishes them. A tag marked "built
# locally" (deploy-release.ps1 -Local) is left alone. Run by hand on a tag to
# build it again after a failure.
#
# Its caches are cache.yml's, kept on main: a tag reads only its own caches
# and main's, so one saved here would be read by no later release. They are
# only restored here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.product }}
    strategy:
      matrix:
        product: [Popup, Keyboard]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The .NET SDK in a folder of its own, its Android workload with it,
      # from main's cache (cache.yml): installing the workload is most of a
      # build's time. A cache's path is absolute, with no ..: one with .. is
      # never saved.
      - name: SDK folder
        run: |
          "DOTNET_INSTALL_DIR=$(Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'dotnet')" >> $env:GITHUB_ENV

      - name: Built locally?
        id: tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { throw "Run this on a release tag (v1.2.3), not on $tag." }
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $message = git tag -l --format='%(contents)' $tag
          "local=$(if ($message -match 'built locally') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - id: sdk
        if: steps.tag.outputs.local != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-${{ hashFiles('global.json') }}-android-${{ runner.os }}

      - uses: actions/setup-dotnet@v4
        if: steps.tag.outputs.local != 'true'
        with:
          global-json-file: global.json

      - uses: actions/cache/restore@v4
        if: steps.tag.outputs.local != 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.product }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.product }}-

      - name: Install workloads
        if: steps.tag.outputs.local != 'true' && steps.sdk.outputs.cache-hit != 'true'
        run: dotnet workload install android

      # The tag and the csproj say the same version, or the release would
      # carry APKs of another.
      - name: Tag and version agree
        if: steps.tag.outputs.local != 'true'
        run: |
          $version = ([xml](Get-Content Berpiztu.KeyPlus.csproj)).Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ -is [string] } | Select-Object -First 1
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "The tag ${{ github.ref_name }} is not the csproj's v$version."
          }

      # The same signing key as every earlier APK, or Android refuses the
      # update: with no key the build would make a new one, so it stops
      # instead.
      - name: Signing key
        if: steps.tag.outputs.local != 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if (-not $env:KEYSTORE -or -not $env:KEYSTORE_PASS) {
            throw "The repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS are needed (README.md, Releasing)."
          }
          $folder = Join-Path $env:RUNNER_TEMP "signing"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $folder "android.keystore"), [Convert]::FromBase64String($env:KEYSTORE))
          "KEYPLUS_KEYSTORE=$(Join-Path $folder 'android.keystore')" >> $env:GITHUB_ENV
          "KEYPLUS_KEYSTORE_PASS=$env:KEYSTORE_PASS" >> $env:GITHUB_ENV

      - name: Build the APK
        # security-watch is asked signed in: GitHub's shared runners soon run out of anonymous questions (403).
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.tag.outputs.local != 'true'
        run: .\build-apk.ps1 -NoBump -Product ${{ matrix.product }}

      - uses: actions/upload-artifact@v4
        if: steps.tag.outputs.local != 'true'
        with:
          name: apk-${{ matrix.product }}
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Build the Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Built locally?
        id: tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { throw "Run this on a release tag (v1.2.3), not on $tag." }
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $message = git tag -l --format='%(contents)' $tag
          "local=$(if ($message -match 'built locally') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.tag.outputs.local != 'true'
        with:
          global-json-file: global.json

      - uses: actions/cache/restore@v4
        if: steps.tag.outputs.local != 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-windows-${{ hashFiles('windows/*.csproj', 'packaging/windows-install/*.wixproj') }}
          restore-keys: nuget-${{ runner.os }}-windows-

      # The installer carries the tag's version, the csproj's.
      - name: Build the installer
        if: steps.tag.outputs.local != 'true'
        run: |
          $version = ([xml](Get-Content Berpiztu.KeyPlus.csproj)).Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ -is [string] } | Select-Object -First 1
          if ("${{ github.ref_name }}" -ne "v$version") { throw "The tag ${{ github.ref_name }} is not the csproj's v$version." }
          .\build-windows-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        if: steps.tag.outputs.local != 'true'
        with:
          name: msi-windows
          path: dist/Berpiztu-AI-Keyboard-Windows.msi
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Built locally?
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          message=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}" --jq '.object.url' | xargs gh api --jq '.message // ""')
          if echo "$message" | grep -q 'built locally'; then echo "local=true" >> "$GITHUB_OUTPUT"; else echo "local=false" >> "$GITHUB_OUTPUT"; fi

      # The release's notes, the only file of the repository this job needs.
      - uses: actions/checkout@v4
        if: steps.tag.outputs.local != 'true'
        with:
          sparse-checkout: docs/release-notes

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.local != 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        if: steps.tag.outputs.local != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          files=(dist/KeyPlus-Popup.apk dist/Berpiztu-AI-Keyboard.apk dist/Berpiztu-AI-Keyboard-Windows.msi)
          for file in "${files[@]}"; do [ -f "$file" ] || { echo "Missing $file"; exit 1; }; done
          # What the version brings, written beside the code (docs/release-notes/<version>.md),
          # goes first on the release's page, above the list GitHub writes itself.
          notes=()
          if [ -f "docs/release-notes/${tag#v}.md" ]; then notes=(--notes-file "docs/release-notes/${tag#v}.md"); fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "KeyPlus ${tag#v}" --generate-notes "${notes[@]}"
          fi
