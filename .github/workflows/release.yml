name: Release

# A release tag (v1.0.0.<build>), pushed by deploy-release.ps1, built and
# published here: the two APKs, KeyPlus-Popup and Berpiztu-AI-Keyboard, each
# built by a job of its own, side by side, at exactly the version the tag's
# commit carries, signed with the same key as every earlier one; then one
# job publishes both. Run by hand on a tag to build it again after a failure.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.product }}
    strategy:
      matrix:
        product: [Popup, Keyboard]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    # The .NET SDK in a folder of its own, its Android workload with it, kept
    # in the cache: installing the workload is most of a release's time, and
    # a cached SDK spares it. Raise the key's last number to start afresh
    # (a newer SDK or workload).
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\..\dotnet
    steps:
      - uses: actions/checkout@v4

      - id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\dotnet
          key: dotnet-10-android-${{ runner.os }}-1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The NuGet packages of the last build with the same project, so a
      # release downloads only what changed.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install the Android workload
        if: steps.sdk.outputs.cache-hit != 'true'
        run: dotnet workload install android

      # The tag and version.props say the same version, or the release would
      # carry APKs of another.
      - name: Tag and version agree
        run: |
          $build = ([xml](Get-Content version.props)).Project.PropertyGroup.BuildNumber
          if ("${{ github.ref_name }}" -ne "v1.0.0.$build") {
            throw "The tag ${{ github.ref_name }} is not version.props' v1.0.0.$build."
          }

      # The same signing key as every earlier APK, or Android refuses the
      # update: with no key the build would make a new one, so it stops
      # instead.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if (-not $env:KEYSTORE -or -not $env:KEYSTORE_PASS) {
            throw "The repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS are needed (README.md, Releasing)."
          }
          $folder = Join-Path $env:RUNNER_TEMP "signing"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $folder "android.keystore"), [Convert]::FromBase64String($env:KEYSTORE))
          "KEYPLUS_KEYSTORE=$(Join-Path $folder 'android.keystore')" >> $env:GITHUB_ENV
          "KEYPLUS_KEYSTORE_PASS=$env:KEYSTORE_PASS" >> $env:GITHUB_ENV

      - name: Build the APK
        run: .\build-apk.ps1 -NoBump -Product ${{ matrix.product }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.product }}
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          files=(dist/*-${tag#v}.apk)
          if [ ${#files[@]} -ne 2 ]; then echo "Expected the two APKs of $tag, found: ${files[*]}"; exit 1; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "KeyPlus ${tag#v}" --generate-notes
          fi
